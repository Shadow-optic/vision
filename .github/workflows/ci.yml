name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_LOG: info

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: visioninjustice
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d visioninjustice"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --workspace --lib --bins
      - name: Integration tests
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/visioninjustice
        run: cargo test --workspace -- --test-threads=1 --nocapture
