services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: visioninjustice
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d visioninjustice"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["8080:8080"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/visioninjustice
      BIND_ADDR: 0.0.0.0:8080
      RUST_LOG: info,vi_api=debug
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["vi-ingest"]
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/visioninjustice
      # Anonymous public feeds. The courts registry runs first because a record
      # cannot be screened until its court is placed in a forum.
      INGEST_SOURCES: courtlistener-courts,courtlistener-search,courtlistener-feed
      CL_SEARCH_QUERIES: brady violation;prosecutorial misconduct;fabricated evidence
      CL_FEED_COURTS: ca9,scotus
      # Without a token these feeds yield extracts rather than opinions, and
      # every such row is stored as `snippet` rather than passed off as one.
      CL_API_TOKEN: "${CL_API_TOKEN:-}"
      INGEST_INTERVAL_SECS: "900"
      RUST_LOG: info,vi_ingest=info,vi_pipeline=info
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
